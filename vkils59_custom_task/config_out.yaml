saved_model_path:
restart_training: False

dataset:
  root_path: /lustre/fswork/projects/rech/umy/ugg72ez/hpc_sync/Datasets/VKI-LS59/
  train_latents_path:
  test_latents_path:

optim:
  batch_size: 4
  batch_size_val:
  lr_inr : 1e-3
  epochs : 1000
  lr_mlp : 1e-4
  weight_decay_mlp: 0
  num_points: 16000

inr:
  model_type : "ms_fourier_features"
  latent_dim : 10
  in_dim : 4
  out_dim : 2
  out_scalar_dim : 0
  depth : 6
  hidden_dim : 256
  w0 :
  use_latent: True
  modulate_scale: False
  modulate_shift: True
  hypernet_depth: 4
  hypernet_width: 256
  frequency_embedding: 'gaussian'
  include_input: True
  scale: [0.5,1]
  num_frequencies: 64
  max_frequencies: 8
  base_frequency: 1.25
  last_activation:
  loss_type: "mse"
  add_cond_in: False
  add_sdf_in:
  global_norm: False
